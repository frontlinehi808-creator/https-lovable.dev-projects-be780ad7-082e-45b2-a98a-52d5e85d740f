name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
        env:
          VITE_SUPABASE_URL: https://lrkvfuovgifdskgcxtgq.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci-placeholder
      - uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist
